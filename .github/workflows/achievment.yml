name: GitHub Achievements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  github-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sonu-kumar-singh-28
          filename: github-achievements.svg
          base: ""

          plugin_achievements: no
          output_action: commit
