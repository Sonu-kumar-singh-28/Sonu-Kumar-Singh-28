name: GitHub Achievements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  github-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sonu-kumar-singh-28
          filename: github-achievements.svg
          base: ""

          plugin_achievements: yes
          plugin_achievements_only: polyglot, stargazer, sponsor, deployer, member, maintainer, developer, scripter, packager, explorer, infographile, manager
          plugin_achievements_display: compact
          plugin_achievements_threshold: X

          output_action: commit
